<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小游戏运行监控</title><style>
body{font:15px system-ui,sans-serif;background:#edf3ef;color:#173c47;margin:auto;padding:24px;max-width:1400px}header{display:flex;justify-content:space-between;align-items:center}button{min-height:44px;padding:8px 16px;font:inherit;border:1px solid #b8ccc2;background:white;border-radius:10px;cursor:pointer}section{background:#fffdf7;border:1px solid #d4dfd7;border-radius:16px;padding:18px;margin:16px 0;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #e1e9e1;padding:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.summary{display:flex;gap:24px;flex-wrap:wrap}.summary strong{font-size:28px;display:block}small{color:#55766a}a{color:inherit}#status{min-height:24px}
</style></head><body><header><h1>小游戏运行监控</h1><a href="/games/">返回大厅</a></header><p>仅管理员可读取。在线量按可见页面会话统计；详细游玩记录来自同意采集的玩家，不能直接用于计费、发奖或判断作弊。</p><button id="refresh">刷新</button><span id="status" role="status"></span><section id="overview" class="summary"></section><section><h2>最近六小时在线采样</h2><div id="samples"></div></section><section><h2>每日在线峰值</h2><div id="daily"></div></section><section><h2>最近 30 天记录概况</h2><div id="totals"></div></section><section><h2>近期游玩与升级明细（最多 200 条）</h2><div id="events"></div></section><section><h2>支持者异常付款核对</h2><p>只在核对真实钱包流水后使用，操作会留下审计记录，绝不再次扣款。</p><form id="review"><label>请求编号 <input name="request_id" required></label><label>账户 ID <input name="user_id" type="number" min="1" required></label><select name="decision"><option value="paid">已核实扣款，补发权益</option><option value="unpaid">已核实未扣款，关闭订单</option></select><label>流水凭证 <input name="reference"></label><label>证据备注 <input name="note" minlength="8" maxlength="1000" required></label><button>确认复核</button></form><p id="review-status" role="status"></p></section><script type="module" src="./game-monitor.js"></script></body></html>

location = /games {
    return 302 /games/;
}
location = /games/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    access_log off;
}
location = /games/bumper/socket {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    access_log off;
}
location = /games/fat-fish {
    return 302 /games/fat-fish/;
}
location ^~ /games/fat-fish/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    client_max_body_size 80k;
    access_log off;
}
location = /games/bumper {
    return 302 /games/bumper/;
}
location ^~ /games/bumper/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    client_max_body_size 80k;
    access_log off;
}
location = /fat-fish-entry.js {
    alias /srv/fat-fish/deploy/entry.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
}
